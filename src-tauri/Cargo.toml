[package]
name = "journal"
version = "0.1.0"
description = "A private, local-first journal"
edition = "2021"
rust-version = "1.77.2"
default-run = "journal"

[lib]
name = "journal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
